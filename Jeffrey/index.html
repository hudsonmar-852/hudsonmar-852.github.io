<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Jeffrey Reminder Board</title>
  <style>
    :root{--bg:#07101d;--panel:#101d2d;--panel2:#16263a;--text:#f7f9fc;--muted:#9fb0c5;--line:#263a52;--accent:#68e2ca;--blue:#6ca8ff;--gold:#f4c86a;--danger:#ff8c8c;--success:#68e2ca}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#17385e 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:20px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand h1{margin:0;font-size:clamp(1.65rem,5vw,2.5rem)}.brand p{margin:4px 0 0;color:var(--muted)}.back{color:var(--muted);text-decoration:none}.tabs{position:sticky;top:8px;z-index:3;display:flex;gap:8px;padding:8px;background:rgba(7,16,29,.9);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.tab{flex:1;border:0;border-radius:11px;padding:11px 10px;background:transparent;color:var(--muted);font:inherit;font-weight:800;cursor:pointer}.tab.active{background:var(--panel2);color:var(--text)}.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:5px;border-radius:999px;background:#263b55;color:var(--text);font-size:.75rem}.grid{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel2),var(--panel));padding:20px;box-shadow:0 16px 42px rgba(0,0,0,.18)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.82rem}.rank{color:var(--accent);font-weight:900}.message{font-size:1.16rem;font-weight:750;margin:16px 0 18px}.actions{display:flex;align-items:center;gap:9px}.btn{border:1px solid var(--line);border-radius:12px;background:#0d1928;color:var(--text);padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{flex:1;background:var(--text);color:#07101d;border-color:var(--text)}.btn.primary.copied{background:rgba(104,226,202,.18);color:var(--success);border-color:var(--success)}.btn.fav{width:46px;height:46px;padding:0;border-radius:50%;font-size:1.45rem;line-height:1;color:var(--muted);background:#0d1928}.btn.fav.active{color:var(--gold);background:rgba(244,200,106,.12);border-color:var(--gold)}.empty{text-align:center;padding:46px 18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f7f9fc;color:#07101d;padding:11px 16px;border-radius:999px;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:var(--danger)}
    @media(max-width:560px){.wrap{width:min(100% - 16px,900px)}.top{align-items:flex-start}.back{font-size:.9rem}.message{font-size:1.08rem}.tabs{top:4px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><h1>Jeffrey Reminder Board</h1><p>Production Top 5 · <span id="boardDate">載入中</span> · 收藏訊息會保留喺收藏庫</p></div><a class="back" href="../">返回 Portal</a></header>
    <nav class="tabs" aria-label="訊息篩選">
      <button class="tab active" data-view="all">今日精選 <span id="allCount" class="badge">0</span></button>
      <button class="tab" data-view="favorites">★ 收藏 <span id="favCount" class="badge">0</span></button>
    </nav>
    <section id="list" class="grid" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const FAVOURITES_KEY='jeffrey-reminder-favourites-v2';
    const COPIED_KEY='jeffrey-reminder-copied-v1';
    const LEGACY_KEY='jeffrey-reminder-favourites-v1';
    const BOARD_URL='../aios/modules/jeffrey/boards/current-top5.json';
    const list=document.querySelector('#list');
    const allCount=document.querySelector('#allCount');
    const favCount=document.querySelector('#favCount');
    const boardDate=document.querySelector('#boardDate');
    const toast=document.querySelector('#toast');
    let messages=[];
    let view='all';

    function messageId(item){return item.id||`${item.theme||'message'}:${item.customer_text||''}`}
    function readJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
    function getFavourites(){
      const saved=readJson(FAVOURITES_KEY,{});
      if(Object.keys(saved).length)return saved;
      const legacy=readJson(LEGACY_KEY,[]);
      return Array.isArray(legacy)?Object.fromEntries(legacy.map(id=>[id,null])):{};
    }
    function saveFavourites(map){localStorage.setItem(FAVOURITES_KEY,JSON.stringify(map))}
    function getCopied(){return new Set(readJson(COPIED_KEY,[]))}
    function saveCopied(set){localStorage.setItem(COPIED_KEY,JSON.stringify([...set]))}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1500)}
    function setView(next){view=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
    function normaliseFavourite(id,item){return {id,rank:item.rank||'',theme:item.theme||'',customer_text:item.customer_text||'',saved_at:new Date().toISOString()}}
    function favouriteRows(){
      const map=getFavourites();
      return Object.entries(map).map(([id,item])=>item||messages.find(m=>messageId(m)===id)).filter(Boolean).sort((a,b)=>String(b.saved_at||'').localeCompare(String(a.saved_at||'')));
    }
    function render(){
      const favourites=getFavourites();
      const copied=getCopied();
      allCount.textContent=messages.length;
      favCount.textContent=favouriteRows().length;
      const rows=view==='favorites'?favouriteRows():messages;
      if(!rows.length){
        list.innerHTML=`<div class="empty">${view==='favorites'?'未有收藏訊息。撳空心星 ☆ 收藏，之後可以喺呢度搵返。':'暫時未有可顯示訊息。'}</div>`;
        return;
      }
      list.innerHTML=rows.map(item=>{
        const id=messageId(item),active=Boolean(favourites[id]),isCopied=copied.has(id);
        return `<article class="card" data-id="${escapeHtml(id)}"><div class="meta"><span class="rank">${item.rank?`#${escapeHtml(item.rank)}`:'收藏'}</span><span>${escapeHtml((item.theme||'').replaceAll('_',' '))}</span></div><div class="message">${escapeHtml(item.customer_text||'')}</div><div class="actions"><button class="btn primary copy ${isCopied?'copied':''}" type="button">${isCopied?'✓ 已複製':'複製短訊'}</button><button class="btn fav ${active?'active':''}" type="button" aria-label="${active?'取消收藏':'收藏'}" title="${active?'取消收藏':'收藏'}" aria-pressed="${active}">${active?'★':'☆'}</button></div></article>`
      }).join('');
    }
    list.addEventListener('click',async event=>{
      const card=event.target.closest('.card');if(!card)return;
      const id=card.dataset.id;
      const item=(view==='favorites'?favouriteRows():messages).find(m=>messageId(m)===id);if(!item)return;
      if(event.target.closest('.copy')){
        try{
          await navigator.clipboard.writeText(item.customer_text);
          const copied=getCopied();copied.add(id);saveCopied(copied);render();showToast('已複製');
        }catch{showToast('未能自動複製')}
      }
      if(event.target.closest('.fav')){
        const favourites=getFavourites();
        if(favourites[id]){delete favourites[id];showToast('已取消收藏')}else{favourites[id]=normaliseFavourite(id,item);showToast('已收藏')}
        saveFavourites(favourites);render();
      }
    });
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
    const freshBoardUrl=`${BOARD_URL}?v=${Date.now()}`;
    fetch(freshBoardUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('board');return r.json()}).then(data=>{messages=Array.isArray(data.messages)?data.messages.slice(0,5):[];boardDate.textContent=data.date||'日期未提供';render()}).catch(()=>{boardDate.textContent='更新失敗';list.innerHTML='<div class="empty error">暫時未能載入 production board，請稍後重新整理。</div>'});
  </script>
</body>
</html>
