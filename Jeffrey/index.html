<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Jeffrey Reminder Board</title>
  <style>
    :root{--bg:#07101d;--panel:#101d2d;--panel2:#16263a;--text:#f7f9fc;--muted:#9fb0c5;--line:#263a52;--accent:#68e2ca;--blue:#6ca8ff;--gold:#f4c86a;--danger:#ff8c8c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#17385e 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:20px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand h1{margin:0;font-size:clamp(1.65rem,5vw,2.5rem)}.brand p{margin:4px 0 0;color:var(--muted)}.back{color:var(--muted);text-decoration:none}.tabs{position:sticky;top:8px;z-index:3;display:flex;gap:8px;padding:8px;background:rgba(7,16,29,.9);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;margin-bottom:18px}.tab{flex:1;border:0;border-radius:11px;padding:11px 10px;background:transparent;color:var(--muted);font:inherit;font-weight:800;cursor:pointer}.tab.active{background:var(--panel2);color:var(--text)}.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:5px;border-radius:999px;background:#263b55;color:var(--text);font-size:.75rem}.grid{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel2),var(--panel));padding:20px;box-shadow:0 16px 42px rgba(0,0,0,.18)}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.82rem}.rank{color:var(--accent);font-weight:900}.message{font-size:1.16rem;font-weight:750;margin:16px 0 18px}.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid var(--line);border-radius:12px;background:#0d1928;color:var(--text);padding:10px 13px;font:inherit;font-weight:800;cursor:pointer}.btn.primary{background:var(--text);color:#07101d;border-color:var(--text)}.btn.fav.active{color:#171006;background:var(--gold);border-color:var(--gold)}.empty{text-align:center;padding:46px 18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f7f9fc;color:#07101d;padding:11px 16px;border-radius:999px;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:var(--danger)}
    @media(max-width:560px){.wrap{width:min(100% - 16px,900px)}.top{align-items:flex-start}.back{font-size:.9rem}.message{font-size:1.08rem}.btn{flex:1}.tabs{top:4px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><h1>Jeffrey Reminder Board</h1><p>Production Top 5 · 收藏後可隨時搵返</p></div><a class="back" href="../">返回 Portal</a></header>
    <nav class="tabs" aria-label="訊息篩選">
      <button class="tab active" data-view="all">全部 <span id="allCount" class="badge">0</span></button>
      <button class="tab" data-view="favorites">已收藏 <span id="favCount" class="badge">0</span></button>
    </nav>
    <section id="list" class="grid" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const STORAGE_KEY='jeffrey-reminder-favourites-v1';
    const BOARD_URL='../aios/modules/jeffrey/boards/current-top5.json';
    const list=document.querySelector('#list');
    const allCount=document.querySelector('#allCount');
    const favCount=document.querySelector('#favCount');
    const toast=document.querySelector('#toast');
    let messages=[];
    let view='all';

    function getFavourites(){
      try{return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'))}catch{return new Set()}
    }
    function saveFavourites(set){localStorage.setItem(STORAGE_KEY,JSON.stringify([...set]))}
    function messageId(item){return `${item.theme||'message'}:${item.rank||0}:${item.customer_text||''}`}
    function escapeHtml(value){return String(value).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
    function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1500)}
    function setView(next){view=next;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
    function render(){
      const favourites=getFavourites();
      allCount.textContent=messages.length;
      favCount.textContent=messages.filter(m=>favourites.has(messageId(m))).length;
      const rows=view==='favorites'?messages.filter(m=>favourites.has(messageId(m))):messages;
      if(!rows.length){
        list.innerHTML=`<div class="empty">${view==='favorites'?'未有收藏訊息。返去「全部」按收藏，之後會喺呢度搵得返。':'暫時未有可顯示訊息。'}</div>`;
        return;
      }
      list.innerHTML=rows.map(item=>{
        const id=messageId(item),active=favourites.has(id);
        return `<article class="card" data-id="${escapeHtml(id)}"><div class="meta"><span class="rank">#${escapeHtml(item.rank||'')}</span><span>${escapeHtml((item.theme||'').replaceAll('_',' '))}</span></div><div class="message">${escapeHtml(item.customer_text||'')}</div><div class="actions"><button class="btn primary copy" type="button">複製短訊</button><button class="btn fav ${active?'active':''}" type="button" aria-pressed="${active}">${active?'★ 已收藏':'☆ 收藏'}</button></div></article>`
      }).join('');
    }
    list.addEventListener('click',async event=>{
      const card=event.target.closest('.card');if(!card)return;
      const item=messages.find(m=>messageId(m)===card.dataset.id);if(!item)return;
      if(event.target.closest('.copy')){
        try{await navigator.clipboard.writeText(item.customer_text);showToast('已複製')}catch{showToast('未能自動複製')}
      }
      if(event.target.closest('.fav')){
        const favourites=getFavourites(),id=messageId(item);
        if(favourites.has(id)){favourites.delete(id);showToast('已取消收藏')}else{favourites.add(id);showToast('已收藏，可在「已收藏」查看')}
        saveFavourites(favourites);render();
      }
    });
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
    fetch(BOARD_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('board');return r.json()}).then(data=>{messages=Array.isArray(data.messages)?data.messages:[];render()}).catch(()=>{list.innerHTML='<div class="empty error">暫時未能載入 production board，請稍後重新整理。</div>'});
  </script>
</body>
</html>
