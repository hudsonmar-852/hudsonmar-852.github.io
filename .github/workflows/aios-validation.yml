name: AIOS validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test public production baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test aios/tests/*.test.mjs aios/phase1/tests/*.test.mjs avataros/tests/*.test.mjs functions/private-test/index.test.mjs

      - name: Validate production assets
        run: |
          node aios/scripts/validate-production-consolidation.mjs
          node aios/scripts/validate-agent-operating-context.mjs
          node aios/phase1/scripts/validate-release.mjs
          node avataros/scripts/validate-avataros.mjs

      - name: Check JavaScript syntax
        run: |
          node --check functions/private-test/index.js
          node --check functions/private-test/index.test.mjs
          node --check aios/scripts/validate-production-consolidation.mjs
          node --check aios/scripts/secret-scan.mjs
          node --check aios/tests/production-consolidation.test.mjs
          node --check aios/job-match/engine.mjs
          node --check aios/job-match/app.mjs
          node --check aios/job-match/scripts/generate-daily.mjs
          node --check aios/tests/job-match.test.mjs
          node --check aios/content-pipeline/engine.mjs
          node --check aios/tests/content-pipeline.test.mjs
          node --check aios/tests/dashboard-theme.test.mjs
          node --check aios/core/mission-manager.mjs
          node --check aios/core/decision-engine.mjs
          node --check aios/core/production-orchestrator.mjs
          node --check aios/core/plugin-sdk.mjs
          node --check aios/core/visual-qa.mjs
          node --check aios/services/drive-file-service/Code.js
          node --check aios/tests/secret-scan.test.mjs
          node --check aios/work-items/engine.mjs
          node --check aios/work-items/adapters.mjs
          node --check aios/work-items/app.mjs
          node --check aios/tests/work-items.test.mjs
          node --check aios/tests/work-items-page.test.mjs
          node --check aios/video-engine/engine.mjs
          node --check aios/video-engine/p1.mjs
          node --check aios/tests/video-engine.test.mjs
          node --check avataros/scripts/validate-avataros.mjs
          node --check avataros/scripts/build-image-prompt.mjs
          node --check avataros/tests/prompt-builder.test.mjs
          node --check avataros/tests/validation.test.mjs
